<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script>
    // Set theme before paint to avoid a flash of the wrong scheme.
    (function () {
      var stored = localStorage.getItem("theme");
      if (stored) document.documentElement.setAttribute("data-theme", stored);
    })();
  </script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <header class="site-header">
    <nav class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>

  <script>
    // Background: a fixed wall of CP437 glyphs that never move. A demoscene
    // fire simulation (hot source at the bottom, cooling as it rises) drives
    // only the COLOR of each glyph, frame by frame.
    (function () {
      var el = document.getElementById("bg");
      if (!el) return;
      var chars = "░░░▒▒▓│┤╣║╗╝┐└┴┬├─┼╚╔╩╦╠═╬█▄▀♠♣♥♦•○§¶≡±÷≈°·√⌐¬½¼«»αßΓπΣσµτΦΘΩδ∞φε∩";
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var PAL_N = 64;
      var cols, rows, spans, lastIdx, heat, palette, raf, lastT = 0;
      var src; // per-column flame-root intensity

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }

      // Fire palette: cold faint glyph -> deep red -> orange -> yellow -> white.
      function buildPalette() {
        var stops = currentTheme() === "light"
          ? [[0, [0,0,0,0.05]], [0.35, [150,55,10,0.16]], [0.6, [200,85,15,0.30]],
             [0.82, [220,120,25,0.42]], [1, [232,158,55,0.55]]]
          : [[0, [255,255,255,0.06]], [0.28, [110,18,8,0.34]], [0.52, [214,58,20,0.62]],
             [0.74, [255,138,32,0.85]], [0.9, [255,210,92,0.95]], [1, [255,255,224,1]]];
        palette = new Array(PAL_N);
        for (var i = 0; i < PAL_N; i++) {
          var t = i / (PAL_N - 1), a = stops[0], b = stops[stops.length - 1];
          for (var s = 0; s < stops.length - 1; s++) {
            if (t >= stops[s][0] && t <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
          }
          var f = (t - a[0]) / ((b[0] - a[0]) || 1), c = [];
          for (var k = 0; k < 4; k++) c[k] = a[1][k] + (b[1][k] - a[1][k]) * f;
          palette[i] = "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + c[3].toFixed(3) + ")";
        }
        if (lastIdx) for (var j = 0; j < lastIdx.length; j++) lastIdx[j] = -1;
      }

      function measure() {
        var probe = document.createElement("span");
        probe.textContent = "X".repeat(100);
        el.appendChild(probe);
        var cw = probe.getBoundingClientRect().width / 100;
        el.removeChild(probe);
        var lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
        return { cw: cw || 13.6, lh: lh };
      }

      function build() {
        var m = measure();
        cols = Math.ceil(window.innerWidth / m.cw) + 1;
        rows = Math.ceil(window.innerHeight / m.lh) + 1;
        var html = "";
        for (var y = 0; y < rows; y++) {
          html += "<div>";
          for (var x = 0; x < cols; x++) html += "<span>" + chars[(Math.random() * chars.length) | 0] + "</span>";
          html += "</div>";
        }
        el.innerHTML = html;
        spans = el.getElementsByTagName("span");
        var n = rows * cols;
        heat = new Float32Array(n);
        lastIdx = new Int16Array(n);
        for (var i = 0; i < n; i++) lastIdx[i] = -1;
        buildSource();
        buildPalette();
      }

      // A warm baseline across the whole width (full fire, no cold gaps) with
      // many wide overlapping hot bumps, so tongues vary tall-to-short.
      function buildSource() {
        src = new Float32Array(cols);
        for (var x = 0; x < cols; x++) src[x] = 0.62; // full warm base across the width
        var bumps = Math.max(6, Math.round(cols / 5));
        for (var f = 0; f < bumps; f++) {
          var c = (Math.random() * cols) | 0;
          var w = 3 + ((Math.random() * 6) | 0);   // wide half-width in cells
          var peak = 0.3 + Math.random() * 0.25;   // stacked on the baseline
          for (var dx = -w; dx <= w; dx++) {
            var xx = c + dx;
            if (xx < 0 || xx >= cols) continue;
            src[xx] += peak * (1 - Math.abs(dx) / (w + 1)); // triangular falloff
          }
        }
        for (var i = 0; i < cols; i++) if (src[i] > 1) src[i] = 1;
      }

      function step() {
        var base = (rows - 1) * cols, x;
        // Seed the bottom row: each cell flickers randomly every frame (lively,
        // ragged tops), scaled by its flame-root intensity (big where bumps are).
        for (x = 0; x < cols; x++) {
          var s = src[x] * (0.45 + Math.random() * 0.55);
          heat[base + x] = s > 1 ? 1 : s;
        }
        // Rise tall (little decay) with a center bias, so the hot roots climb
        // higher than their neighbours instead of averaging into a flat top.
        for (var y = 0; y < rows - 1; y++) {
          var row = y * cols, below = (y + 1) * cols,
              below2 = (y + 2 < rows ? y + 2 : rows - 1) * cols;
          for (x = 0; x < cols; x++) {
            var l = x > 0 ? x - 1 : 0, r = x < cols - 1 ? x + 1 : cols - 1;
            var v = (heat[below + l] * 0.72 + heat[below + x] * 2.0 + heat[below + r] * 0.72 + heat[below2 + x]) / 4.63;
            v -= Math.random() * 0.008; // flickering tips
            heat[row + x] = v > 0 ? v : 0;
          }
        }
      }

      function render() {
        for (var i = 0; i < spans.length; i++) {
          var idx = (heat[i] * (PAL_N - 1)) | 0;
          if (idx > PAL_N - 1) idx = PAL_N - 1;
          if (idx !== lastIdx[i]) { spans[i].style.color = palette[idx]; lastIdx[i] = idx; }
        }
      }

      function frame(t) {
        if (t - lastT >= 33) { lastT = t; step(); render(); } // ~30fps
        raf = requestAnimationFrame(frame);
      }

      build();
      if (reduce) {
        render(); // static, no animation
      } else {
        for (var w = 0; w < 12; w++) step(); // warm up so flames are already rising
        render();
        raf = requestAnimationFrame(frame);
      }

      // Repaint with the new palette when the theme changes.
      new MutationObserver(buildPalette).observe(document.documentElement,
        { attributes: true, attributeFilter: ["data-theme"] });

      // Pause when the tab is hidden.
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { cancelAnimationFrame(raf); }
        else if (!reduce) { lastT = 0; raf = requestAnimationFrame(frame); }
      });

      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () {
          cancelAnimationFrame(raf);
          build();
          if (reduce) render();
          else { for (var w = 0; w < 12; w++) step(); raf = requestAnimationFrame(frame); }
        }, 200);
      });
    })();

    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });
  </script>
</body>
</html>
