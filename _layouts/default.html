<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script>
    // Set theme before paint to avoid a flash of the wrong scheme.
    (function () {
      var stored = localStorage.getItem("theme");
      if (stored) document.documentElement.setAttribute("data-theme", stored);
    })();
  </script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <header class="site-header">
    <nav class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/settings/' | relative_url }}">Settings</a>
        <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>

  <script>
    // Background: a fixed wall of CP437 glyphs that never move. A demoscene
    // fire simulation (hot source at the bottom, cooling as it rises) drives
    // only the COLOR of each glyph. Tunable via window.Fire (see /settings/).
    window.Fire = (function () {
      var el = document.getElementById("bg");
      if (!el) return null;
      var chars = "░░░▒▒▓│┤╣║╗╝┐└┴┬├─┼╚╔╩╦╠═╬█▄▀♠♣♥♦•○§¶≡±÷≈°·√⌐¬½¼«»αßΓπΣσµτΦΘΩδ∞φε∩";
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var PAL_N = 64;

      // Tunable parameters (all 0..1 unless noted). Saved per-browser.
      var defaults = { height: 0.73, width: 0.6, variance: 0.5, brightness: 0.6, speed: 1, scale: 16 };
      var params = Object.assign({}, defaults);
      try { Object.assign(params, JSON.parse(localStorage.getItem("fireSettings") || "{}")); } catch (e) {}

      var cols, rows, spans, lastIdx, heat, palette, src, raf, lastT = 0;
      var BASE, BUMP_PEAK, BUMP_DIV, BUMP_W, WL, WC, WD, DIVISOR, COOL, GAIN, INTERVAL;

      function lerp(a, b, t) { return a + (b - a) * t; }

      // Translate friendly 0..1 params into the simulation's constants.
      function computeDerived() {
        // Width = flame breadth: low -> thin separated flames over dark gaps;
        // high -> broad tongues over a full warm base.
        BASE = lerp(0.12, 0.62, params.width);
        BUMP_PEAK = lerp(0.1, 0.6, params.variance);
        BUMP_DIV = lerp(10, 4, params.variance);
        BUMP_W = Math.round(lerp(1, 10, params.width));  // wider flames -> wider hot roots
        WC = lerp(3.4, 0.9, params.width);   // thin center-heavy streaks -> broad tongues
        WL = lerp(0.25, 1.15, params.width);
        WD = 1.0;
        DIVISOR = (WL * 2 + WC + WD) / lerp(0.94, 0.992, params.height); // higher -> taller
        COOL = 0.007;
        GAIN = lerp(0.5, 1.8, params.brightness); // heat -> colour gain (dim red .. white-hot)
        INTERVAL = Math.max(16, 1000 / (30 * params.speed));
      }

      function currentTheme() {
        return document.documentElement.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      }

      // Fire palette: transparent (background) -> deep red -> orange -> yellow -> white.
      function buildPalette() {
        var stops = currentTheme() === "light"
          ? [[0, [150,55,10,0]], [0.35, [150,55,10,0.16]], [0.6, [200,85,15,0.30]],
             [0.82, [220,120,25,0.42]], [1, [232,158,55,0.55]]]
          : [[0, [110,18,8,0]], [0.28, [110,18,8,0.34]], [0.52, [214,58,20,0.62]],
             [0.74, [255,138,32,0.85]], [0.9, [255,210,92,0.95]], [1, [255,255,224,1]]];
        palette = new Array(PAL_N);
        for (var i = 0; i < PAL_N; i++) {
          var t = i / (PAL_N - 1), a = stops[0], b = stops[stops.length - 1];
          for (var s = 0; s < stops.length - 1; s++) {
            if (t >= stops[s][0] && t <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
          }
          var f = (t - a[0]) / ((b[0] - a[0]) || 1), c = [];
          for (var k = 0; k < 4; k++) c[k] = a[1][k] + (b[1][k] - a[1][k]) * f;
          palette[i] = "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + c[3].toFixed(3) + ")";
        }
        if (lastIdx) for (var j = 0; j < lastIdx.length; j++) lastIdx[j] = -1;
      }

      function measure() {
        var probe = document.createElement("span");
        probe.textContent = "X".repeat(100);
        el.appendChild(probe);
        var cw = probe.getBoundingClientRect().width / 100;
        el.removeChild(probe);
        var lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
        return { cw: cw || 13.6, lh: lh };
      }

      function build() {
        var m = measure();
        cols = Math.ceil(window.innerWidth / m.cw) + 1;
        rows = Math.ceil(window.innerHeight / m.lh) + 1;
        var html = "";
        for (var y = 0; y < rows; y++) {
          html += "<div>";
          for (var x = 0; x < cols; x++) html += "<span>" + chars[(Math.random() * chars.length) | 0] + "</span>";
          html += "</div>";
        }
        el.innerHTML = html;
        spans = el.getElementsByTagName("span");
        var n = rows * cols;
        heat = new Float32Array(n);
        lastIdx = new Int16Array(n);
        for (var i = 0; i < n; i++) lastIdx[i] = -1;
        buildSource();
        buildPalette();
      }

      // Warm baseline across the whole width plus wide overlapping hot bumps,
      // so tongues vary tall-to-short.
      function buildSource() {
        src = new Float32Array(cols);
        for (var x = 0; x < cols; x++) src[x] = BASE;
        var bumps = Math.max(4, Math.round(cols / BUMP_DIV));
        for (var f = 0; f < bumps; f++) {
          var c = (Math.random() * cols) | 0;
          var w = BUMP_W + ((Math.random() * 3) | 0);
          var peak = BUMP_PEAK * (0.6 + Math.random() * 0.4);
          for (var dx = -w; dx <= w; dx++) {
            var xx = c + dx;
            if (xx < 0 || xx >= cols) continue;
            src[xx] += peak * (1 - Math.abs(dx) / (w + 1));
          }
        }
        for (var i = 0; i < cols; i++) if (src[i] > 1) src[i] = 1;
      }

      function step() {
        var base = (rows - 1) * cols, x;
        for (x = 0; x < cols; x++) {
          var s = src[x] * (0.45 + Math.random() * 0.55); // per-cell flicker
          heat[base + x] = s > 1 ? 1 : s;
        }
        for (var y = 0; y < rows - 1; y++) {
          var row = y * cols, below = (y + 1) * cols,
              below2 = (y + 2 < rows ? y + 2 : rows - 1) * cols;
          for (x = 0; x < cols; x++) {
            var l = x > 0 ? x - 1 : 0, r = x < cols - 1 ? x + 1 : cols - 1;
            var v = (heat[below + l] * WL + heat[below + x] * WC + heat[below + r] * WL + heat[below2 + x] * WD) / DIVISOR;
            v -= Math.random() * COOL;
            heat[row + x] = v > 0 ? v : 0;
          }
        }
      }

      function render() {
        for (var i = 0; i < spans.length; i++) {
          var idx = (heat[i] * GAIN * (PAL_N - 1)) | 0;
          if (idx > PAL_N - 1) idx = PAL_N - 1;
          if (idx !== lastIdx[i]) { spans[i].style.color = palette[idx]; lastIdx[i] = idx; }
        }
      }

      function frame(t) {
        if (t - lastT >= INTERVAL) { lastT = t; step(); render(); }
        raf = requestAnimationFrame(frame);
      }

      function start() {
        cancelAnimationFrame(raf);
        for (var w = 0; w < 14; w++) step(); // warm up so flames are already rising
        render();
        if (!reduce) { lastT = 0; raf = requestAnimationFrame(frame); }
      }

      computeDerived();
      el.style.fontSize = params.scale + "px";
      build();
      start();

      new MutationObserver(function () { buildPalette(); if (reduce) render(); })
        .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { cancelAnimationFrame(raf); }
        else if (!reduce) { lastT = 0; raf = requestAnimationFrame(frame); }
      });

      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () { build(); start(); }, 200);
      });

      function save() { try { localStorage.setItem("fireSettings", JSON.stringify(params)); } catch (e) {} }

      return {
        defaults: Object.assign({}, defaults),
        get params() { return Object.assign({}, params); },
        apply: function (patch) {
          var needGrid = patch.scale !== undefined && patch.scale !== params.scale;
          var needSource = (patch.variance !== undefined && patch.variance !== params.variance) ||
                           (patch.width !== undefined && patch.width !== params.width);
          Object.assign(params, patch);
          computeDerived();
          save();
          if (needGrid) { el.style.fontSize = params.scale + "px"; build(); start(); return; }
          if (needSource) buildSource();
          if (reduce) { for (var w = 0; w < 14; w++) step(); render(); }
        },
        reset: function () {
          try { localStorage.removeItem("fireSettings"); } catch (e) {}
          Object.assign(params, defaults);
          computeDerived();
          el.style.fontSize = params.scale + "px";
          build();
          start();
          return Object.assign({}, defaults);
        }
      };
    })();

    document.getElementById("theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var current = root.getAttribute("data-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      var next = current === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
    });
  </script>
</body>
</html>
