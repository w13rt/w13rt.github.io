<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div id="bg" aria-hidden="true"></div>
  <header class="site-header">
    <nav class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="nav-links">
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/topics/' | relative_url }}">Topics</a>
        <a href="{{ '/settings/' | relative_url }}">Settings</a>
      </div>
    </nav>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; {{ 'now' | date: "%Y" }} {{ site.author }}</span>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>

  <script>
    // Background: a fixed wall of CP437 glyphs that never move. A demoscene
    // fire simulation (hot source at the bottom, cooling as it rises) drives
    // only the COLOR of each glyph. Tunable via window.Fire (see /settings/).
    window.Fire = (function () {
      var el = document.getElementById("bg");
      if (!el) return null;
      var chars = "░░░▒▒▓│┤╣║╗╝┐└┴┬├─┼╚╔╩╦╠═╬█▄▀♠♣♥♦•○§¶≡±÷≈°·√⌐¬½¼«»αßΓπΣσµτΦΘΩδ∞φε∩";
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var PAL_N = 64;

      // Tunable parameters (all 0..1 unless noted). Saved per-browser.
      var defaults = {
        height: 0.8, width: 0.75, variance: 0.5, brightness: 0.75,
        centerDensity: 0.65, centerSpread: 0.7, fps: 15, scale: 16
      };
      var params = Object.assign({}, defaults);
      try { Object.assign(params, JSON.parse(localStorage.getItem("fireSettings") || "{}")); } catch (e) {}

      var cols, rows, spans, lastIdx, heat, palette, src, raf, lastT = 0;
      var CW = 8, LH = 20, card = null; // cell size + the content card we tint
      var BASE, BUMP_PEAK, BUMP_DIV, BUMP_W, WL, WC, WD, DIVISOR, COOL, GAIN, INTERVAL;

      function lerp(a, b, t) { return a + (b - a) * t; }

      // Translate friendly 0..1 params into the simulation's constants.
      function computeDerived() {
        // Width = flame breadth: low -> thin separated flames over dark gaps;
        // high -> broad tongues over a full warm base.
        BASE = lerp(0.12, 0.62, params.width);
        BUMP_PEAK = lerp(0.1, 0.6, params.variance);
        BUMP_DIV = lerp(10, 4, params.variance);
        BUMP_W = Math.round(lerp(1, 10, params.width));  // wider flames -> wider hot roots
        WC = lerp(3.4, 0.9, params.width);   // thin center-heavy streaks -> broad tongues
        WL = lerp(0.25, 1.15, params.width);
        WD = 1.0;
        DIVISOR = (WL * 2 + WC + WD) / lerp(0.94, 0.992, params.height); // higher -> taller
        COOL = 0.007;
        GAIN = lerp(0.5, 1.8, params.brightness); // heat -> colour gain (dim red .. white-hot)
        INTERVAL = 1000 / params.fps;
      }

      // Fire palette: transparent (background) -> deep red -> orange -> yellow -> white.
      function buildPalette() {
        var stops = [[0, [110,18,8,0]], [0.28, [110,18,8,0.34]], [0.52, [214,58,20,0.62]],
             [0.74, [255,138,32,0.85]], [0.9, [255,210,92,0.95]], [1, [255,255,224,1]]];
        palette = new Array(PAL_N);
        for (var i = 0; i < PAL_N; i++) {
          var t = i / (PAL_N - 1), a = stops[0], b = stops[stops.length - 1];
          for (var s = 0; s < stops.length - 1; s++) {
            if (t >= stops[s][0] && t <= stops[s + 1][0]) { a = stops[s]; b = stops[s + 1]; break; }
          }
          var f = (t - a[0]) / ((b[0] - a[0]) || 1), c = [];
          for (var k = 0; k < 4; k++) c[k] = a[1][k] + (b[1][k] - a[1][k]) * f;
          palette[i] = "rgba(" + (c[0]|0) + "," + (c[1]|0) + "," + (c[2]|0) + "," + c[3].toFixed(3) + ")";
        }
        if (lastIdx) for (var j = 0; j < lastIdx.length; j++) lastIdx[j] = -1;
      }

      function measure() {
        var probe = document.createElement("span");
        probe.textContent = "X".repeat(100);
        el.appendChild(probe);
        var cw = probe.getBoundingClientRect().width / 100;
        el.removeChild(probe);
        var lh = parseFloat(getComputedStyle(el).lineHeight) || 20;
        return { cw: cw || 13.6, lh: lh };
      }

      function build() {
        var m = measure();
        CW = m.cw; LH = m.lh;
        cols = Math.ceil(window.innerWidth / m.cw) + 1;
        rows = Math.ceil(window.innerHeight / m.lh) + 1;
        var html = "";
        for (var y = 0; y < rows; y++) {
          html += "<div>";
          for (var x = 0; x < cols; x++) html += "<span>" + chars[(Math.random() * chars.length) | 0] + "</span>";
          html += "</div>";
        }
        el.innerHTML = html;
        spans = el.getElementsByTagName("span");
        var n = rows * cols;
        heat = new Float32Array(n);
        lastIdx = new Int16Array(n);
        for (var i = 0; i < n; i++) lastIdx[i] = -1;
        buildSource();
        buildPalette();
      }

      // Warm baseline across the whole width plus wide overlapping hot bumps,
      // so tongues vary tall-to-short. A denser cluster is anchored below the
      // content card, keeping several flame tongues beneath the post column.
      function buildSource() {
        src = new Float32Array(cols);
        for (var x = 0; x < cols; x++) src[x] = BASE;

        function addBump(c, w, peak) {
          for (var dx = -w; dx <= w; dx++) {
            var xx = c + dx;
            if (xx < 0 || xx >= cols) continue;
            src[xx] += peak * (1 - Math.abs(dx) / (w + 1));
          }
        }

        var bumps = Math.max(4, Math.round(cols / BUMP_DIV));
        for (var f = 0; f < bumps; f++) {
          var c = (Math.random() * cols) | 0;
          var w = BUMP_W + ((Math.random() * 3) | 0);
          var peak = BUMP_PEAK * (0.6 + Math.random() * 0.4);
          addBump(c, w, peak);
        }

        var content = document.querySelector("main.wrap");
        var rect = content && content.getBoundingClientRect();
        var cardLeft = rect ? Math.max(0, rect.left / CW) : cols * 0.25;
        var cardRight = rect ? Math.min(cols - 1, rect.right / CW) : cols * 0.75;
        var cardCenter = (cardLeft + cardRight) / 2;
        var halfSpread = Math.max(1, (cardRight - cardLeft) * lerp(0.08, 0.5, params.centerSpread));
        var clusterLeft = Math.max(0, Math.floor(cardCenter - halfSpread));
        var clusterRight = Math.min(cols - 1, Math.ceil(cardCenter + halfSpread));

        // A soft heat floor prevents gaps between the individual cluster sources.
        for (x = clusterLeft; x <= clusterRight; x++) {
          var distance = Math.abs(x - cardCenter) / halfSpread;
          src[x] += params.centerDensity * (0.2 + 0.24 * (1 - distance * distance));
        }

        // Spread several sources across the band. Their small positional, width,
        // and heat variations make the guaranteed cluster feel organic.
        var clusterBumps = Math.round(lerp(3, 10, params.centerDensity) * params.centerDensity);
        for (f = 0; f < clusterBumps; f++) {
          var slot = (f + 0.5 + (Math.random() - 0.5) * 0.7) / clusterBumps;
          var clusterCenter = Math.round(clusterLeft + (clusterRight - clusterLeft) * slot);
          var clusterWidth = BUMP_W + ((Math.random() * 3) | 0);
          var clusterPeak = lerp(0.18, 0.62, params.centerDensity) *
                            lerp(0.7, 1.25, params.variance) * (0.7 + Math.random() * 0.3);
          addBump(clusterCenter, clusterWidth, clusterPeak);
        }
        for (var i = 0; i < cols; i++) if (src[i] > 1) src[i] = 1;
      }

      function step() {
        var base = (rows - 1) * cols, x;
        for (x = 0; x < cols; x++) {
          var s = src[x] * (0.45 + Math.random() * 0.55); // per-cell flicker
          heat[base + x] = s > 1 ? 1 : s;
        }
        for (var y = 0; y < rows - 1; y++) {
          var row = y * cols, below = (y + 1) * cols,
              below2 = (y + 2 < rows ? y + 2 : rows - 1) * cols;
          for (x = 0; x < cols; x++) {
            var l = x > 0 ? x - 1 : 0, r = x < cols - 1 ? x + 1 : cols - 1;
            var v = (heat[below + l] * WL + heat[below + x] * WC + heat[below + r] * WL + heat[below2 + x] * WD) / DIVISOR;
            v -= Math.random() * COOL;
            heat[row + x] = v > 0 ? v : 0;
          }
        }
      }

      function render() {
        for (var i = 0; i < spans.length; i++) {
          var idx = (heat[i] * GAIN * (PAL_N - 1)) | 0;
          if (idx > PAL_N - 1) idx = PAL_N - 1;
          if (idx !== lastIdx[i]) { spans[i].style.color = palette[idx]; lastIdx[i] = idx; }
        }
      }

      // Heat at a viewport pixel (the glyph grid is viewport-fixed).
      function heatAt(px, py) {
        var col = (px / CW) | 0; if (col < 0) col = 0; else if (col >= cols) col = cols - 1;
        var row = (py / LH) | 0; if (row < 0) row = 0; else if (row >= rows) row = rows - 1;
        return heat[row * cols + col];
      }

      // Flame colour at a viewport pixel (averaged across a few nearby samples).
      function colorAt(px, py) {
        var idx = (heatAt(px, py) * GAIN * (PAL_N - 1)) | 0;
        if (idx < 9) idx = 9;                 // faint ember floor so the frame stays visible
        if (idx > PAL_N - 1) idx = PAL_N - 1;
        return palette[idx];
      }

      // Paint the card border as a vertical gradient of the flames behind it,
      // so each edge fades from hot at the bottom to dark at the top.
      function paintBorder() {
        if (!card) card = document.querySelector("main.wrap");
        if (!card) return;
        var r = card.getBoundingClientRect(), N = 12, stops = "";
        for (var i = 0; i < N; i++) {
          var t = i / (N - 1), y = r.top + (r.bottom - r.top) * t;
          var c = colorAt((i % 2 ? r.right : r.left), y); // alternate edges for a blended feel
          stops += (i ? "," : "") + c + " " + (t * 100).toFixed(1) + "%";
        }
        card.style.borderImageSource = "linear-gradient(to bottom, " + stops + ")";
      }

      // Publish a live flame colour (a mid-height flame tone that flickers) as
      // a CSS variable, so hover states can pick it up. Sampled from a small
      // central patch so it gently shifts rather than averaging flat.
      function flameVar() {
        var yb = (rows * 0.45) | 0, xc = cols >> 1, sum = 0, cnt = 0;
        for (var y = yb - 1; y <= yb + 1; y++) {
          var yy = y < 0 ? 0 : (y >= rows ? rows - 1 : y);
          for (var x = xc - 3; x <= xc + 3; x++) {
            var xx = x < 0 ? 0 : (x >= cols ? cols - 1 : x);
            sum += heat[yy * cols + xx]; cnt++;
          }
        }
        var idx = (sum / cnt * GAIN * (PAL_N - 1)) | 0;
        if (idx < 34) idx = 34; else if (idx > 62) idx = 62;
        document.documentElement.style.setProperty("--flame-live", palette[idx]);
      }

      function frame(t) {
        if (t - lastT >= INTERVAL) { lastT = t; step(); render(); paintBorder(); flameVar(); }
        raf = requestAnimationFrame(frame);
      }

      // Run enough steps for heat to reach its full steady-state height (one
      // row rises per step) so the first frame shows fully-grown flames.
      function warmup() {
        var n = rows + 25;
        for (var w = 0; w < n; w++) step();
      }

      function start() {
        cancelAnimationFrame(raf);
        warmup();
        render();
        paintBorder();
        flameVar();
        if (!reduce) { lastT = 0; raf = requestAnimationFrame(frame); }
      }

      computeDerived();
      el.style.fontSize = params.scale + "px";
      build();
      start();

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { cancelAnimationFrame(raf); }
        else if (!reduce) { lastT = 0; raf = requestAnimationFrame(frame); }
      });

      var rt;
      window.addEventListener("resize", function () {
        clearTimeout(rt);
        rt = setTimeout(function () { build(); start(); }, 200);
      });

      function save() { try { localStorage.setItem("fireSettings", JSON.stringify(params)); } catch (e) {} }

      return {
        defaults: Object.assign({}, defaults),
        get params() { return Object.assign({}, params); },
        apply: function (patch) {
          var needGrid = patch.scale !== undefined && patch.scale !== params.scale;
          var needSource = (patch.variance !== undefined && patch.variance !== params.variance) ||
                           (patch.width !== undefined && patch.width !== params.width) ||
                           (patch.centerDensity !== undefined && patch.centerDensity !== params.centerDensity) ||
                           (patch.centerSpread !== undefined && patch.centerSpread !== params.centerSpread);
          Object.assign(params, patch);
          computeDerived();
          save();
          if (needGrid) { el.style.fontSize = params.scale + "px"; build(); start(); return; }
          if (needSource) buildSource();
          if (reduce) { warmup(); render(); }
        },
        reset: function () {
          try { localStorage.removeItem("fireSettings"); } catch (e) {}
          Object.assign(params, defaults);
          computeDerived();
          el.style.fontSize = params.scale + "px";
          build();
          start();
          return Object.assign({}, defaults);
        }
      };
    })();
  </script>
</body>
</html>
