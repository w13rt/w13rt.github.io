<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- w13rt favicon: a pixel-art flame in the site's demoscene fire palette
       (deep red -> orange -> yellow -> white-hot). Transparent background. -->
  <!-- deep red base / outer tongues -->
  <g fill="#6e1208">
    <rect x="2" y="13" width="12" height="3"/>
    <rect x="2" y="10" width="1" height="3"/>
    <rect x="13" y="10" width="1" height="3"/>
    <rect x="4" y="3" width="1" height="2"/>
    <rect x="11" y="4" width="1" height="2"/>
    <rect x="8" y="1" width="1" height="2"/>
  </g>
  <!-- orange body -->
  <g fill="#d63a14">
    <rect x="3" y="9" width="10" height="4"/>
    <rect x="4" y="6" width="8" height="3"/>
    <rect x="5" y="4" width="3" height="2"/>
    <rect x="9" y="6" width="2" height="1"/>
    <rect x="6" y="2" width="1" height="2"/>
  </g>
  <!-- yellow core -->
  <g fill="#ffd25c">
    <rect x="5" y="10" width="6" height="3"/>
    <rect x="5" y="7" width="4" height="3"/>
    <rect x="6" y="5" width="2" height="2"/>
  </g>
  <!-- white-hot heart -->
  <g fill="#fffee0">
    <rect x="6" y="10" width="3" height="3"/>
    <rect x="6" y="8" width="2" height="2"/>
  </g>
</svg>
