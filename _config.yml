# Site settings
title: w13rt
description: Place for stuff
author: w13rt
url: "https://w13rt.github.io"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title/

sass:
  style: compressed

# Pagination-free simplicity: all posts on the index.
# Add jekyll-paginate later if the archive grows large.

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
